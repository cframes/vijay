<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
"
/>

<title>CFrames AR Experience</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

font-family:Arial,sans-serif;

background:transparent;

}

/* =========================
INTRO SCREEN
========================= */

#startScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

z-index:9999;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:#000;

}

/* =========================
BACKGROUND IMAGE
========================= */

#introImage{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

}

/* =========================
OVERLAY
========================= */

.overlay{

position:absolute;
inset:0;

background:
rgba(0,0,0,0.30);

}

/* =========================
GLASS BUTTON
========================= */

#startBtn{

position:absolute;

bottom:80px;
left:50%;

transform:translateX(-50%);

z-index:10;

padding:18px 42px;

border:none;

border-radius:24px;

background:
rgba(255,255,255,0.14);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,0.25);

color:#fff;

font-size:18px;
font-weight:600;

cursor:pointer;

transition:.25s ease;

}

#startBtn:active{

transform:
translateX(-50%)
scale(.96);

}

/* =========================
AR CAMERA FIX
========================= */

a-scene{

position:fixed !important;

top:0 !important;
left:0 !important;

width:100vw !important;
height:100vh !important;

z-index:1 !important;

background:transparent !important;

}

/* REMOVE DEFAULT UI */

.mindar-ui-overlay{
display:none !important;
}

.a-loader-title{
display:none !important;
}

.a-enter-vr{
display:none !important;
}

canvas{
display:block !important;
background:transparent !important;
}

video{
max-width:none !important;
}

.a-video{
object-fit:cover !important;
}

</style>

</head>

<body>

<!-- =========================
INTRO SCREEN
========================= -->

<div id="startScreen">

<!-- BACKGROUND IMAGE -->

<img
id="introImage"
src="background.jpg"
alt="Background"
/>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- BUTTON -->

<button id="startBtn">
Start AR Experience
</button>

</div>

<!-- =========================
AR SCENE
========================= -->

<a-scene

embedded

loading-screen="enabled:false"

mindar-image="

imageTargetSrc: targets.mind;

autoStart:true;

uiScanning:false;
uiLoading:false;
uiError:false;

/* SMOOTH TRACKING */

filterMinCF:0.0001;
filterBeta:0.001;

warmupTolerance:8;
missTolerance:12;

"

renderer="
antialias:true;
alpha:true;
precision:medium;
"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="
enabled:false
"

>

<!-- =========================
ASSETS
========================= -->

<a-assets timeout="10000">

<video
id="vid"
src="video.mp4"
preload="auto"
crossorigin="anonymous"
playsinline
webkit-playsinline
loop
muted
></video>

</a-assets>

<!-- =========================
CAMERA
========================= -->

<a-camera
position="0 0 0"
look-controls="enabled:false"
camera="near:0.01; far:10000"
></a-camera>

<!-- =========================
TARGET
========================= -->

<a-entity

id="target"

mindar-image-target="
targetIndex:0
"

animation="
property: position;
dur:250;
easing:easeOutQuad;
"

animation__rotation="
property: rotation;
dur:250;
easing:easeOutQuad;
"

>

<!-- =========================
VIDEO
========================= -->

<a-video

id="videoPlane"

src="#vid"

position="0 0.02 0"

width="0.82"
height="1.15"

material="
shader:flat;
transparent:true;
side:double;
"

></a-video>

</a-entity>

</a-scene>

<script>

document.addEventListener(
"DOMContentLoaded",
() => {

/* =========================
ELEMENTS
========================= */

const startBtn =
document.getElementById("startBtn");

const startScreen =
document.getElementById("startScreen");

const video =
document.getElementById("vid");

const target =
document.getElementById("target");

/* =========================
START BUTTON
========================= */

startBtn.addEventListener(
"click",
async () => {

try{

/* UNLOCK AUDIO */

video.muted = false;

/* HIDE INTRO */

startScreen.style.transition =
"opacity .5s ease";

startScreen.style.opacity = "0";

setTimeout(() => {

startScreen.style.display =
"none";

},500);

}catch(err){

console.log(err);

}

});

/* =========================
TARGET FOUND
========================= */

target.addEventListener(
"targetFound",
async () => {

try{

video.currentTime = 0;

await video.play();

}catch(err){

console.log(err);

}

});

/* =========================
TARGET LOST
========================= */

target.addEventListener(
"targetLost",
() => {

video.pause();

video.currentTime = 0;

});

});

</script>

</body>

</html>
