<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
/>

<title>Professional AR Frame</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  touch-action: none;
}

/* Start Screen */
#startScreen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.45);
  z-index: 9999;
}

#startBtn {
  border: none;
  outline: none;
  padding: 16px 28px;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- Start Screen -->
<div id="startScreen">
  <button id="startBtn">
    Tap To Start AR
  </button>
</div>

<a-scene

mindar-image="
imageTargetSrc: targets.mind;

autoStart: true;
uiScanning: false;
uiLoading: false;
uiError: false;

/* Smooth Tracking */
filterMinCF: 0.0005;
filterBeta: 0.001;

warmupTolerance: 20;
missTolerance: 5;
"

renderer="
antialias: true;
alpha: true;
precision: high;
physicallyCorrectLights: true;
colorManagement: true;
"

color-space="sRGB"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
>

<!-- Assets -->
<a-assets timeout="10000">

<video
id="vid"
src="video.mp4"
preload="auto"
crossorigin="anonymous"
playsinline
webkit-playsinline
loop
></video>

</a-assets>

<!-- Camera -->
<a-camera
position="0 0 0"
look-controls="enabled: false"
></a-camera>

<!-- AR Target -->
<a-entity
id="target"
mindar-image-target="targetIndex: 0"
>

<!-- Video Plane -->
<a-video
id="videoPlane"
src="#vid"
position="0 0 0"
width="1"
height="1"
material="shader: flat;"
></a-video>

</a-entity>

</a-scene>

<script>
document.addEventListener(
"DOMContentLoaded",
() => {

const video =
document.getElementById("vid");

const target =
document.getElementById("target");

const plane =
document.getElementById("videoPlane");

const startBtn =
document.getElementById("startBtn");

const startScreen =
document.getElementById("startScreen");

let audioReady = false;

// -------------------
// AUTO FIT VIDEO
// -------------------
video.addEventListener(
"loadedmetadata",
() => {

const aspect =
video.videoWidth /
video.videoHeight;

// Square frame
const frameWidth = 1;
const frameHeight = 1;

let width;
let height;

// COVER FIT
if (
aspect >
frameWidth /
frameHeight
) {

height = frameHeight;
width = height * aspect;

} else {

width = frameWidth;
height = width / aspect;
}

plane.setAttribute(
"width",
width
);

plane.setAttribute(
"height",
height
);

});

// -------------------
// AUDIO UNLOCK
// -------------------
startBtn.addEventListener(
"click",
async () => {

try {

video.muted = false;
video.volume = 1;

await video.play();
video.pause();

audioReady = true;

startScreen.style.display =
"none";

} catch(err) {
console.log(err);
}

});

// -------------------
// TARGET FOUND
// -------------------
target.addEventListener(
"targetFound",
async () => {

if (!audioReady) return;

try {
await video.play();
} catch(err) {
console.log(err);
}

});

// -------------------
// TARGET LOST
// -------------------
target.addEventListener(
"targetLost",
() => {

video.pause();

});

});
</script>

</body>
</html>
