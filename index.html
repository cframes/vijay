material="shader:flat; transparent:true;"

></a-video>

</a-entity>

</a-scene>

<script>

document.addEventListener(
"DOMContentLoaded",
() => {

/* =========================
ELEMENTS
========================= */

const startBtn =
document.getElementById("startBtn");

const introScreen =
document.getElementById("introScreen");

const arVideo =
document.getElementById("arVideo");

const target =
document.getElementById("target");

const plane =
document.getElementById("videoPlane");

/* =========================
STATES
========================= */

let audioReady = false;
let isPlaying = false;

/* =========================
AUTO FIT VIDEO
========================= */

arVideo.addEventListener(
"loadedmetadata",
() => {

const aspect =
arVideo.videoWidth /
arVideo.videoHeight;

const frameWidth = 1;
const frameHeight = 1;

let width;
let height;

if(
aspect >
frameWidth /
frameHeight
){

height = frameHeight;

width =
height * aspect;

}else{

width = frameWidth;

height =
width / aspect;

}

plane.setAttribute(
"width",
width
);

plane.setAttribute(
"height",
height
);

});

/* =========================
START BUTTON
========================= */

startBtn.addEventListener(
"click",
async () => {

try{

/* ENABLE AUDIO */

arVideo.muted = false;

await arVideo.play();

arVideo.pause();

audioReady = true;

/* FADE OUT INTRO */

introScreen.style.transition =
"opacity 1s ease";

introScreen.style.opacity = "0";

/* REMOVE INTRO */

setTimeout(() => {

introScreen.style.display =
"none";

},1000);

}catch(err){

console.log(err);

}

});

/* =========================
TARGET FOUND
========================= */

target.addEventListener(
"targetFound",
async () => {

if(!audioReady) return;
if(isPlaying) return;

try{

await arVideo.play();

isPlaying = true;

}catch(err){

console.log(err);

}

});

/* =========================
TARGET LOST
========================= */

target.addEventListener(
"targetLost",
() => {

arVideo.pause();

isPlaying = false;

});

});

/* =========================
CAMERA ERROR
========================= */

window.addEventListener(
"camera-error",
() => {

alert(
"Camera permission required"
);

});

</script>

</body>
</html>
