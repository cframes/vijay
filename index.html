<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
"
/>

<title>cframes AR Experience</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:Arial,sans-serif;
background:#000;
}

/* =========================
INTRO SCREEN
========================= */

#startScreen{

position:fixed;
inset:0;

z-index:9999;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:#000;

}

/* =========================
BACKGROUND IMAGE
========================= */

#introImage{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

}

/* =========================
DARK OVERLAY
========================= */

.overlay{

position:absolute;
inset:0;

background:
rgba(0,0,0,0.35);

}

/* =========================
GLASS BUTTON
========================= */

#startBtn{

position:absolute;

bottom:80px;
left:50%;

transform:translateX(-50%);

z-index:10;

padding:18px 42px;

border:none;

border-radius:24px;

background:
rgba(255,255,255,0.14);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,0.25);

color:#fff;

font-size:18px;
font-weight:600;

cursor:pointer;

transition:.25s ease;

}

/* BUTTON CLICK */

#startBtn:active{

transform:
translateX(-50%)
scale(.96);

}

/* =========================
AR SCENE
========================= */

a-scene{

position:fixed !important;

inset:0 !important;

width:100% !important;
height:100% !important;

}

</style>

</head>

<body>

<!-- =========================
INTRO SCREEN
========================= -->

<div id="startScreen">

<!-- BACKGROUND IMAGE -->

<img
id="introImage"
src="background.jpg"
alt="Background"
/>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- BUTTON -->

<button id="startBtn">
Start AR Experience
</button>

</div>

<!-- =========================
AR SCENE
========================= -->

<a-scene

id="scene"

embedded

color-space="sRGB"

renderer="
colorManagement:true;
physicallyCorrectLights:true;
antialias:true;
alpha:true;
"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="
enabled:false
"

mindar-image="

imageTargetSrc: targets.mind;

autoStart:false;

uiScanning:false;
uiLoading:false;
uiError:false;

filterMinCF:0.001;
filterBeta:0.01;

warmupTolerance:5;
missTolerance:10;

"

>

<!-- =========================
ASSETS
========================= -->

<a-assets timeout="10000">

<!-- AR VIDEO -->

<video
id="vid"
src="video.mp4"
preload="auto"
crossorigin="anonymous"
playsinline
webkit-playsinline
loop
muted
></video>

</a-assets>

<!-- =========================
CAMERA
========================= -->

<a-camera
position="0 0 0"
look-controls="enabled:false"
></a-camera>

<!-- =========================
AR TARGET
========================= -->

<a-entity
id="target"
mindar-image-target="targetIndex:0"
>

<a-video

id="videoPlane"

src="#vid"

position="0 0 0"

width="1"
height="1"

material="
shader:flat;
transparent:true;
"

></a-video>

</a-entity>

</a-scene>

<script>

document.addEventListener(
"DOMContentLoaded",
() => {

/* =========================
ELEMENTS
========================= */

const video =
document.getElementById("vid");

const target =
document.getElementById("target");

const plane =
document.getElementById("videoPlane");

const startBtn =
document.getElementById("startBtn");

const startScreen =
document.getElementById("startScreen");

const scene =
document.getElementById("scene");

/* =========================
AUTO FIT VIDEO
========================= */

video.addEventListener(
"loadedmetadata",
() => {

const aspect =
video.videoWidth /
video.videoHeight;

const frameWidth = 1;
const frameHeight = 1;

let width;
let height;

if(
aspect >
frameWidth /
frameHeight
){

height = frameHeight;

width =
height * aspect;

}else{

width = frameWidth;

height =
width / aspect;

}

plane.setAttribute(
"width",
width
);

plane.setAttribute(
"height",
height
);

});

/* =========================
START BUTTON
========================= */

startBtn.addEventListener(
"click",
async () => {

try {

/* Unlock Audio */

video.muted = false;

await video.play();
video.pause();

/* Start Camera */

const mindarSystem =
scene.systems["mindar-image-system"];

await mindarSystem.start();

/* Hide Intro */

startScreen.style.display =
"none";

} catch(err){

console.log(err);

alert(
"Camera permission required"
);

}

});

/* =========================
TARGET FOUND
========================= */

target.addEventListener(
"targetFound",
async () => {

try{

video.currentTime = 0;

await video.play();

}catch(err){

console.log(err);

}

});

/* =========================
TARGET LOST
========================= */

target.addEventListener(
"targetLost",
() => {

video.pause();

video.currentTime = 0;

});

/* =========================
CAMERA ERROR
========================= */

window.addEventListener(
"camera-error",
() => {

alert(
"Camera permission denied"
);

});

});

</script>

</body>
</html>
