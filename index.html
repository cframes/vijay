<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
"
/>

<title>CFrames AR Experience</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#000;
}

/* =========================
INTRO SCREEN
========================= */

#startScreen{

position:fixed;
inset:0;

z-index:9999;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:#000;

}

/* =========================
BACKGROUND IMAGE
========================= */

#introImage{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

}

/* =========================
OVERLAY
========================= */

.overlay{

position:absolute;
inset:0;

background:
linear-gradient(
to bottom,
rgba(0,0,0,0.15),
rgba(0,0,0,0.45)
);

}

/* =========================
GLASS BUTTON
========================= */

#startBtn{

position:absolute;

bottom:80px;
left:50%;

transform:translateX(-50%);

padding:18px 42px;

border-radius:24px;

border:
1px solid rgba(255,255,255,0.25);

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

color:#fff;

font-size:18px;
font-weight:600;

cursor:pointer;

z-index:10;

transition:
transform .2s ease,
background .2s ease;

}

#startBtn:active{

transform:
translateX(-50%)
scale(.96);

}

/* =========================
FULL CAMERA VIEW
========================= */

a-scene{

position:fixed !important;

top:0;
left:0;

width:100vw !important;
height:100vh !important;

z-index:1;

}

/* REMOVE MINDAR UI */

.mindar-ui-overlay{
display:none !important;
}

/* CAMERA FIX */

video{
max-width:none !important;
}

canvas{
display:block !important;
}

</style>

</head>

<body>

<!-- =========================
INTRO SCREEN
========================= -->

<div id="startScreen">

<!-- BACKGROUND IMAGE -->

<img
id="introImage"
src="background.jpg"
alt="Background"
/>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- BUTTON -->

<button id="startBtn">
Start AR Experience
</button>

</div>

<!-- =========================
AR SCENE
========================= -->

<a-scene

id="scene"

mindar-image="

imageTargetSrc: targets.mind;

autoStart:false;

uiScanning:false;
uiLoading:false;
uiError:false;

filterMinCF:0.001;
filterBeta:0.01;

warmupTolerance:5;
missTolerance:10;

"

renderer="

antialias:true;
colorManagement:true;
physicallyCorrectLights:true;

"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="
enabled:false
"

>

<!-- =========================
ASSETS
========================= -->

<a-assets timeout="10000">

<video
id="vid"
src="video.mp4"
preload="auto"
crossorigin="anonymous"
playsinline
webkit-playsinline
loop
muted
></video>

</a-assets>

<!-- =========================
CAMERA
========================= -->

<a-camera
position="0 0 0"
look-controls="enabled:false"
></a-camera>

<!-- =========================
TARGET
========================= -->

<a-entity
id="target"
mindar-image-target="targetIndex:0"
>

<a-video

id="videoPlane"

src="#vid"

position="0 0 0"

width="1"
height="1"

material="
shader:flat;
transparent:true;
"

></a-video>

</a-entity>

</a-scene>

<script>

document.addEventListener(
"DOMContentLoaded",
() => {

/* =========================
ELEMENTS
========================= */

const scene =
document.getElementById("scene");

const startBtn =
document.getElementById("startBtn");

const startScreen =
document.getElementById("startScreen");

const target =
document.getElementById("target");

const video =
document.getElementById("vid");

const plane =
document.getElementById("videoPlane");

/* =========================
AUTO FIT VIDEO
========================= */

video.addEventListener(
"loadedmetadata",
() => {

const aspect =
video.videoWidth /
video.videoHeight;

let width = 1;
let height = 1;

if(aspect > 1){

height = 1;
width = aspect;

}else{

width = 1;
height = 1 / aspect;

}

plane.setAttribute(
"width",
width
);

plane.setAttribute(
"height",
height
);

});

/* =========================
START BUTTON
========================= */

startBtn.addEventListener(
"click",
async () => {

try{

/* UNLOCK AUDIO */

video.muted = false;

await video.play();
video.pause();

/* START CAMERA */

const mindarSystem =
scene.systems["mindar-image-system"];

/* SMALL DELAY */

setTimeout(async () => {

await mindarSystem.start();

},150);

/* HIDE INTRO */

startScreen.style.transition =
"opacity .6s ease";

startScreen.style.opacity = "0";

setTimeout(() => {

startScreen.style.display =
"none";

},600);

}catch(err){

console.log(err);

alert(
"Please allow camera permission"
);

}

});

/* =========================
TARGET FOUND
========================= */

target.addEventListener(
"targetFound",
async () => {

try{

video.currentTime = 0;

await video.play();

}catch(err){

console.log(err);

}

});

/* =========================
TARGET LOST
========================= */

target.addEventListener(
"targetLost",
() => {

video.pause();

video.currentTime = 0;

});

/* =========================
CAMERA ERROR
========================= */

window.addEventListener(
"camera-error",
() => {

alert(
"Camera access denied"
);

});

});

</script>

</body>
</html>
