<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
/>

<title>AR Frame</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: sans-serif;
}

/* START SCREEN */
#startScreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#startBtn {
  border: none;
  padding: 16px 26px;
  border-radius: 14px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- AUDIO UNLOCK SCREEN -->
<div id="startScreen">
  <button id="startBtn">
    Tap To Start AR
  </button>
</div>

<a-scene
  mindar-image="
    imageTargetSrc: targets.mind;

    autoStart: true;
    uiScanning: false;
    uiLoading: false;
    uiError: false;

    filterMinCF: 0.008;
    filterBeta: 0.015;

    warmupTolerance: 12;
    missTolerance: 10;
  "

  embedded

  renderer="
    antialias: true;
    alpha: true;
    precision: high;
    physicallyCorrectLights: true;
    colorManagement: true;
  "

  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>

<video
  id="vid"
  src="video.mp4"
  preload="auto"
  crossorigin="anonymous"
  playsinline
  webkit-playsinline
  loop
></video>

</a-assets>

<a-camera
  position="0 0 0"
  look-controls="enabled: false"
></a-camera>

<a-entity
  id="target"
  mindar-image-target="targetIndex: 0"
>

<a-video
  id="videoPlane"
  src="#vid"
  position="0 0 0"
  material="shader: flat;"
></a-video>

</a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {

const video =
document.getElementById("vid");

const target =
document.getElementById("target");

const plane =
document.getElementById("videoPlane");

const startBtn =
document.getElementById("startBtn");

const startScreen =
document.getElementById("startScreen");

let audioReady = false;

// --------------------
// AUTO FIT VIDEO
// --------------------
video.addEventListener(
"loadedmetadata",
() => {

const vw = video.videoWidth;
const vh = video.videoHeight;

const aspect = vw / vh;

const frameWidth = 1;
const frameHeight = 1.45;

let width;
let height;

// FULL COVER FIT
if (
aspect >
frameWidth / frameHeight
) {
height = frameHeight;
width = height * aspect;
} else {
width = frameWidth;
height = width / aspect;
}

plane.setAttribute(
"width",
width
);

plane.setAttribute(
"height",
height
);

});

// --------------------
// START BUTTON
// --------------------
startBtn.addEventListener(
"click",
async () => {

try {

video.muted = false;
video.volume = 1;

await video.play();
video.pause();

audioReady = true;

startScreen.style.display =
"none";

} catch (err) {
console.log(err);
}

});

// --------------------
// TARGET FOUND
// --------------------
target.addEventListener(
"targetFound",
async () => {

if (!audioReady) return;

try {
await video.play();
} catch (err) {
console.log(err);
}

});

// --------------------
// TARGET LOST
// --------------------
target.addEventListener(
"targetLost",
() => {

video.pause();

});

});
</script>

</body>
</html>
